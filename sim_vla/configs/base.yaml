# Shared settings for every sim_vla arm. What separates the arms lives in
# configs/experiments/ and is, deliberately, one switch plus its dependant.
#
# model.graph.enabled is not an actor-input flag. It decides whether the graph
# encoder, the semantic latent g, the graph decoder, the graph losses and the
# graph-derived progress supervision are constructed at all. An arm is chosen
# before its world model is trained: a graph-trained world model with g hidden
# from the actor is not a graph-free baseline, because the graph has already
# reached h and z.

model:
  rep_loss: dreamer

  graph:
    enabled: false
    # Read from the collected dataset's metadata at load time and checked
    # against these; a mismatch is refused rather than reshaped.
    n_max: 8
    e_max: 168
    # 0 takes the dataset's own camera count. The packed bbox is
    # (n_max, n_cams, 4) and the graph encoder is 5*n_cams+3 wide, so this is
    # a property of the recording, not of the model preset.
    n_cams: 0

  progress:
    enabled: false          # requires graph.enabled; rejected otherwise
    # Matches configs/model/_base_.yaml, which is what the simulator's own
    # graph arm uses.
    beta: 0.05
    # The compiled task schedule that defines what progress *is*, and the
    # asset tree its roles resolve against. One schedule per task; the
    # repository ships them.
    schedule_dir: scenegraph/configs/schedules
    configs: scenegraph/configs
    # Absolute warm-up bounds are ignored by the pipeline, which scales the
    # warm-up to the run's --online-steps budget instead: a 200k-step run under
    # a 400k start would never turn shaping on, and the arm would silently be
    # plain `graph`. Kept here for a caller that builds ProgressConfig itself.
    beta_warmup_start: 400000
    beta_warmup_end: 700000

data:
  root: data/sim_vla_demos
  name: demos.h5
  # Windows for world-model pretraining. burn_in rows rebuild the recurrent
  # state and are excluded from the loss.
  sequence_length: 64
  burn_in: 8
  batch_size: 16
  # Matches envs/maniskill.py, which builds the online env with
  # ignore_terminations=True. The demonstrations were recorded without that
  # wrapper and do carry terminal flags; honouring them would train a
  # continuation head on a signal the rollout never produces. Set false only
  # for a trainer configured the same way.
  ignore_terminations: true
  normalization: mean_std
  seed: 0

pretrain:
  # Stage 1A's learning rate. null keeps the model preset's lr
  # (configs/model/_base_.yaml, 4e-5). That file is the main trainer's too, so
  # a sim_vla-only change is made here, not there.
  world_lr: null
  # Stage 1B's learning rate. null keeps ImitationConfig's 1e-4.
  imitation_lr: null

online:
  # Same unit as the original trainer: replay timesteps / environment step.
  train_ratio: 64
  # Mixed precision for online training; checkpoint parameters stay unchanged.
  precision: bfloat16
  # Start states imagined together, with gradients accumulated across groups.
  # Every eligible replay state is a start -- there is no cap on how many --
  # so this is what bounds an update's memory. 0 imagines them all at once.
  imagination_microbatch: 16
  # Actor-critic updates before the actor is allowed to step at all. The
  # reward and value heads start flat, so the imagined return does not depend
  # on the action and the actor gradient is exactly zero through them: this is
  # not a safety margin, it is how long the critic takes to mean something.
  critic_warmup: 150
  # Per-phase wall time and CUDA peak memory for each actor-critic update. Off
  # by default: measuring GPU time means synchronizing at every phase
  # boundary, which is itself a cost. Turn it on for a profiling run.
  profile: false
  # null keeps ActorCriticConfig's own 3e-5.
  actor_lr: null
  # The world model's rate in Stage 2; pretrain.world_lr is Stage 1A's. null
  # keeps OnlineConfig's 1e-4.
  world_lr: null
  # null keeps ActorCriticConfig's 3e-4.
  critic_lr: null
  # The graph_progress arm's head. null keeps progress.PROGRESS_LR, 3e-4.
  progress_lr: null
  # Stage 1B's flow-matching loss on demonstrations, weighted into the actor's
  # gradient after the critic warm-up; 0 disables it. anchor_windows are
  # encoded by the world model, anchor_rows of their positions are kept and
  # conditioned anchor_microbatch at a time. grad_report_every logs the RL and
  # anchor gradient norms apart (anchor_grad_ratio); 0 never.
  demo_anchor: 0.0
  anchor_windows: 8
  anchor_rows: 64
  anchor_microbatch: 16
  grad_report_every: 50
  # Progress shaping's ramp in env steps (graph_progress arm). null scales it
  # to 20% -> 60% of --online-steps; set both or neither.
  progress_warmup_start: null
  progress_warmup_end: null
  # Actions generated per chunk from Stage 2 on; Stage 1B still imitates at
  # actor.chunk_size. Only actor.execute of a chunk is ever run, and SmolVLA's
  # action tokens attend causally, so the first actions of a shorter chunk are
  # the ones the full chunk would have produced -- this cuts the expert's work
  # per flow step without changing the policy. Checked on the real expert when
  # Stage 2 starts. At least actor.execute; null keeps actor.chunk_size.
  chunk_size: 5
  # Parallel online envs, like the main trainer's env_num. 1 is the single CPU
  # env the demonstrations were collected in; more than 1 runs ManiSkill's GPU
  # backend, steps every env in lockstep and trains between steps. The update
  # budget is env_steps * train_ratio / (batch_size * sequence_length) either
  # way, so this changes collection speed, not how much training a run gets.
  num_envs: 16
  # Resets between scene rebuilds. null keeps ManiSkill's default, which is
  # per task: PegInsertionSide rebuilds its peg and hole on every reset at one
  # env and never at more, so a parallel run trains on num_envs fixed shapes
  # unless this is set (1 rebuilds every round, and a GPU rebuild is slow).
  reconfiguration_freq: null

actor:
  # "The pretrained checkpoint" is not a reproducible object without a
  # revision, and a branch name is not a revision. download_pretrained.py
  # resolves this to an immutable commit hash and prints what to paste here;
  # an empty value means the run is not pinned and resolves at load time.
  pretrained: lerobot/smolvla_base
  revision: "d9f33c94a60fb382c90dea2164c96845bd955e28"
  # Verified by reading lerobot's source at 0.4.4 and 0.6.1 (identical SmolVLA
  # interface). 0.4.4 is the pin here because 0.6.1 needs python >= 3.12 and
  # this project is 3.11; run `python -m sim_vla.doctor` to check a machine.
  lerobot_version: '0.4.4'
  # 0 means "take the checkpoint's own value", which is what the released
  # model was trained with. These are not defaults to be assumed: the loaded
  # config is what decides, and the tests assert against it.
  chunk_size: 0            # actions predicted per call
  # Actions executed from one generated chunk before replanning. One setting
  # for the environment and for imagination: an imagined rollout executes the
  # same number of actions from one chunk, so the policy being optimised is
  # the policy being run. Must not exceed chunk_size.
  execute: 5
  flow_steps: 5            # Euler steps for collection and imagination
  # One MLP-generated state token beside the tokenized instruction. There is
  # no context-token block.
  state_tokens: 1
  # embedding: the adapter emits vlm_hidden_size and state_proj is bypassed.
  # state_proj: the adapter emits max_state_dim and the frozen projection runs,
  # which puts a 32-wide bottleneck between the world model and the policy.
  state_token_mode: embedding

wandb:
  # All three stages log into one run, because they are one experiment: the
  # stage is a key prefix, not a separate run. Off here means nothing is
  # logged and nothing is required; training never depends on it.
  enabled: true
  project: sim_vla
  entity: ''
  # Empty takes the arm being run: group is the task, so a task's arms land
  # side by side, and name is <task>-<arm>. See training/wandb_logger.py.
  group: ''
  name: ''
  # online | offline | disabled. A compute node without outbound network wants
  # offline, then `wandb sync` on the run directory afterwards.
  mode: online
  tags: []

diagnostics:
  # Recording graphs is not learning from them. This may be true in a baseline
  # run; the objects stay outside learning batches either way.
  record_graphs: false

eval:
  episodes: 20
  max_steps: 150
  seeds_start: 900000      # disjoint from any collection seed block
