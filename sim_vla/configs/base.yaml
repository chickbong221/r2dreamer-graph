# Shared settings for every sim_vla arm. What separates the arms lives in
# configs/experiments/ and is, deliberately, one switch plus its dependant.
#
# model.graph.enabled is not an actor-input flag. It decides whether the graph
# encoder, the semantic latent g, the graph decoder, the graph losses and the
# graph-derived progress supervision are constructed at all. An arm is chosen
# before its world model is trained: a graph-trained world model with g hidden
# from the actor is not a graph-free baseline, because the graph has already
# reached h and z.

model:
  rep_loss: dreamer

  graph:
    enabled: false
    # Read from the collected dataset's metadata at load time and checked
    # against these; a mismatch is refused rather than reshaped.
    n_max: 8
    e_max: 168
    # 0 takes the dataset's own camera count. The packed bbox is
    # (n_max, n_cams, 4) and the graph encoder is 5*n_cams+3 wide, so this is
    # a property of the recording, not of the model preset.
    n_cams: 0

  progress:
    enabled: false          # requires graph.enabled; rejected otherwise
    # Matches configs/model/_base_.yaml, which is what the simulator's own
    # graph arm uses.
    beta: 0.05
    # The compiled task schedule that defines what progress *is*, and the
    # asset tree its roles resolve against. One schedule per task; the
    # repository ships them.
    schedule_dir: scenegraph/configs/schedules
    configs: scenegraph/configs
    # Absolute warm-up bounds are ignored by the pipeline, which scales the
    # warm-up to the run's --online-steps budget instead: a 200k-step run under
    # a 400k start would never turn shaping on, and the arm would silently be
    # plain `graph`. Kept here for a caller that builds ProgressConfig itself.
    beta_warmup_start: 400000
    beta_warmup_end: 700000

data:
  root: data/sim_vla_demos
  name: demos.h5
  # Windows for world-model pretraining. burn_in rows rebuild the recurrent
  # state and are excluded from the loss.
  sequence_length: 64
  burn_in: 8
  batch_size: 16
  # Matches envs/maniskill.py, which builds the online env with
  # ignore_terminations=True. The demonstrations were recorded without that
  # wrapper and do carry terminal flags; honouring them would train a
  # continuation head on a signal the rollout never produces. Set false only
  # for a trainer configured the same way.
  ignore_terminations: true
  normalization: mean_std
  seed: 0

actor:
  # "The pretrained checkpoint" is not a reproducible object without a
  # revision, and a branch name is not a revision. download_pretrained.py
  # resolves this to an immutable commit hash and prints what to paste here;
  # an empty value means the run is not pinned and resolves at load time.
  pretrained: lerobot/smolvla_base
  revision: ''
  # Verified by reading lerobot's source at 0.4.4 and 0.6.1 (identical SmolVLA
  # interface). 0.4.4 is the pin here because 0.6.1 needs python >= 3.12 and
  # this project is 3.11; run `python -m sim_vla.doctor` to check a machine.
  lerobot_version: '0.4.4'
  # 0 means "take the checkpoint's own value", which is what the released
  # model was trained with. These are not defaults to be assumed: the loaded
  # config is what decides, and the tests assert against it.
  chunk_size: 0            # actions predicted per call
  execute: 1               # actions executed before replanning
  flow_steps: 0            # euler steps; 0 takes the checkpoint's num_steps
  # One MLP-generated state token beside the tokenized instruction. There is
  # no context-token block.
  state_tokens: 1
  # embedding: the adapter emits vlm_hidden_size and state_proj is bypassed.
  # state_proj: the adapter emits max_state_dim and the frozen projection runs,
  # which puts a 32-wide bottleneck between the world model and the policy.
  state_token_mode: embedding

diagnostics:
  # Recording graphs is not learning from them. This may be true in a baseline
  # run; the objects stay outside learning batches either way.
  record_graphs: false

eval:
  episodes: 20
  max_steps: 150
  seeds_start: 900000      # disjoint from any collection seed block
