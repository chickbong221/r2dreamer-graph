# Shared settings for every sim_vla arm. What separates the arms lives in
# configs/experiments/ and is, deliberately, one switch plus its dependant.
#
# model.graph.enabled is not an actor-input flag. It decides whether the graph
# encoder, the semantic latent g, the graph decoder, the graph losses and the
# graph-derived progress supervision are constructed at all. An arm is chosen
# before its world model is trained: a graph-trained world model with g hidden
# from the actor is not a graph-free baseline, because the graph has already
# reached h and z.

model:
  rep_loss: dreamer

  graph:
    enabled: false
    # Read from the collected dataset's metadata at load time and checked
    # against these; a mismatch is refused rather than reshaped.
    n_max: 8
    e_max: 168
    # 0 takes the dataset's own camera count. The packed bbox is
    # (n_max, n_cams, 4) and the graph encoder is 5*n_cams+3 wide, so this is
    # a property of the recording, not of the model preset.
    n_cams: 0

  progress:
    enabled: false          # requires graph.enabled; rejected otherwise
    # Matches configs/model/_base_.yaml, which is what the simulator's own
    # graph arm uses.
    beta: 0.05
    # The compiled task schedule that defines what progress *is*, and the
    # asset tree its roles resolve against. One schedule per task; the
    # repository ships them.
    schedule_dir: scenegraph/configs/schedules
    configs: scenegraph/configs
    # Absolute warm-up bounds are ignored by the pipeline, which scales the
    # warm-up to the run's --online-steps budget instead: a 200k-step run under
    # a 400k start would never turn shaping on, and the arm would silently be
    # plain `graph`. Kept here for a caller that builds ProgressConfig itself.
    beta_warmup_start: 400000
    beta_warmup_end: 700000

data:
  root: data/sim_vla_demos
  name: demos.h5
  # Windows for world-model pretraining. burn_in rows rebuild the recurrent
  # state and are excluded from the loss.
  sequence_length: 64
  burn_in: 8
  batch_size: 16
  # Matches envs/maniskill.py, which builds the online env with
  # ignore_terminations=True. The demonstrations were recorded without that
  # wrapper and do carry terminal flags; honouring them would train a
  # continuation head on a signal the rollout never produces. Set false only
  # for a trainer configured the same way.
  ignore_terminations: true
  normalization: mean_std
  seed: 0

online:
  # Same unit as the original trainer: replay timesteps / environment step.
  train_ratio: 64
  # Mixed precision for online training; checkpoint parameters stay unchanged.
  precision: bfloat16
  imagination_batch: 256
  # All selected starts contribute to one update, in bounded-memory groups.
  imagination_microbatch: 16
  # null inherits imag_horizon from the original Dreamer model config.
  imag_horizon: null

  # --------------------------------------------------------- actor objective
  # How the actor's gradient is formed. Both arms of an experiment must use
  # the same value: this is the estimator, not the state, and a difference
  # here would not be a difference between the arms being compared.
  #
  # pathwise         differentiate the imagined return through every flow
  #                  step. The original, and the default: an existing run is
  #                  unaffected by these settings existing.
  # flow_reinforce   sample a stochastic flow path with no graph, then
  #                  differentiate log pi of that recorded path against a
  #                  detached advantage. No PPO: no importance ratio, no
  #                  clipping, no old-policy copy, one optimizer step per
  #                  freshly collected imagined batch.
  actor_objective: pathwise
  # Injected Gaussian noise for flow_reinforce's sampler, in normalized action
  # coordinates. Required and strictly positive for that objective; ignored by
  # pathwise. This is a nominal aggregate scale, not a guarantee about the
  # final action's variance, and it changes the sampling distribution even
  # before any training -- pilot it against the restored Stage 1B policy
  # rather than assuming a value. Candidates to try: 0.01, 0.03, 0.1.
  flow_noise_std: 0.0
  # Versioned, and recorded in the checkpoint: two runs under different
  # schedules are not comparable, and the scale alone does not say which ran.
  flow_noise_schedule: constant_per_step_scaled_by_sqrt_k
  # Scored (environment-step, start-state, flow-step) tuples per backward pass.
  # This is what bounds the actor's backward memory under flow_reinforce, the
  # way imagination_microbatch bounds collection. Independent of both.
  actor_transition_microbatch: 16
  # Actor-critic updates before the actor is allowed to step at all. Neither
  # objective has a learning signal through a freshly initialised value head,
  # so this is not a safety margin -- it is the number of updates it takes for
  # the critic to mean something.
  critic_warmup: 150
  # Flow-matching imitation loss on demonstrations, summed into the same actor
  # update. Zero disables it and does no demonstration work at all; a nonzero
  # value requires a demonstration sampler and fails loudly without one.
  # Not a proven value -- judge it by retained task success, not by the ratio
  # of two losses.
  demo_anchor: 0.0
  # Two separate budgets, because they cost different things. anchor_windows
  # is how many demonstration *windows* are drawn and encoded -- one world
  # model forward each, over the whole window. anchor_rows is how many
  # eligible *positions* survive to be conditioned -- one actor forward each.
  # One window yields many eligible rows, so asking the sampler for
  # anchor_rows windows paid for the expensive half about sequence_length
  # times over.
  anchor_windows: 8
  anchor_window_microbatch: 4
  anchor_rows: 64
  anchor_microbatch: 16
  anchor_retries: 4
  # How often to pay for a separate RL-versus-anchor gradient measurement.
  # Exact separation needs a snapshot of every gradient, so it runs on a
  # cadence; 0 disables it. Worth keeping on: the two terms can differ by
  # enough orders of magnitude that the anchor vanishes into float32 rounding
  # when they are summed, which looks identical to a balanced anchor unless
  # anchor_grad_ratio is logged.
  grad_report_every: 50
  # Per-phase wall time and CUDA peak memory for each actor update. Off by
  # default: measuring GPU time means synchronizing at every phase boundary,
  # which is itself a cost. Turn it on for a profiling run, not for training.
  profile: false
  # null keeps ActorCriticConfig's own 3e-5. Exposed because a score-function
  # estimator is not the pathwise one and does not inherit its tuning; pilot
  # lower values first.
  actor_lr: null
  # Recorded rather than chosen: the advantage is divided once by the Dreamer
  # return EMA's spread, floored at 1, exactly as dreamer.py does it.
  advantage_scale: return_ema
  # Which sampler the reported evaluation uses. flow_reinforce trains a
  # stochastic policy, so that is the policy to evaluate; a deterministic run
  # may be reported beside it but is a different policy and is labelled as one.
  eval_sampler: stochastic

actor:
  # "The pretrained checkpoint" is not a reproducible object without a
  # revision, and a branch name is not a revision. download_pretrained.py
  # resolves this to an immutable commit hash and prints what to paste here;
  # an empty value means the run is not pinned and resolves at load time.
  pretrained: lerobot/smolvla_base
  revision: "d9f33c94a60fb382c90dea2164c96845bd955e28"
  # Verified by reading lerobot's source at 0.4.4 and 0.6.1 (identical SmolVLA
  # interface). 0.4.4 is the pin here because 0.6.1 needs python >= 3.12 and
  # this project is 3.11; run `python -m sim_vla.doctor` to check a machine.
  lerobot_version: '0.4.4'
  # 0 means "take the checkpoint's own value", which is what the released
  # model was trained with. These are not defaults to be assumed: the loaded
  # config is what decides, and the tests assert against it.
  chunk_size: 0            # actions predicted per call
  execute: 1               # actions executed before replanning
  flow_steps: 0            # euler steps; 0 takes the checkpoint's num_steps
  # One MLP-generated state token beside the tokenized instruction. There is
  # no context-token block.
  state_tokens: 1
  # embedding: the adapter emits vlm_hidden_size and state_proj is bypassed.
  # state_proj: the adapter emits max_state_dim and the frozen projection runs,
  # which puts a 32-wide bottleneck between the world model and the policy.
  state_token_mode: embedding

wandb:
  # All three stages log into one run, because they are one experiment: the
  # stage is a key prefix, not a separate run. Off here means nothing is
  # logged and nothing is required; training never depends on it.
  enabled: true
  project: sim_vla
  entity: ''
  # Empty takes the arm being run: group is the task, so a task's arms land
  # side by side, and name is <task>-<arm>. See training/wandb_logger.py.
  group: ''
  name: ''
  # online | offline | disabled. A compute node without outbound network wants
  # offline, then `wandb sync` on the run directory afterwards.
  mode: online
  tags: []

diagnostics:
  # Recording graphs is not learning from them. This may be true in a baseline
  # run; the objects stay outside learning batches either way.
  record_graphs: false

eval:
  episodes: 20
  max_steps: 150
  seeds_start: 900000      # disjoint from any collection seed block
