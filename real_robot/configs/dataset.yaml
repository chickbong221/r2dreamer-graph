source:
  repo_id: hungho77/so101-multitask
  # Resolved to a commit sha by download.py and pinned in source.json.
  revision: main
  fps: 30
  # Camera axis of graph_node_bbox, in this order.
  cameras:
    top: observation.images.top
    wrist: observation.images.wrist
  camera_descriptions:
    top: a fixed camera looking down at the table from above
    wrist: mounted on the gripper; it moves and tilts with it, and the jaws are always at the bottom of its image
  fields:
    state: observation.state
    action: action

paths:
  source: real_robot/outputs/source
  videos: real_robot/outputs/videos
  annotations: real_robot/outputs/annotations
  graphs: real_robot/outputs/graphs
  renders: real_robot/outputs/renders

# auto: the median-length episode of each task.
pilot_episodes: auto
