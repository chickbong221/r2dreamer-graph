# World-model pretraining on the packed dataset. No actor, no critic, no
# imagination objective is constructed at this stage.

dataset: real_robot/outputs/datasets/full_episode_v1
device: cuda:0
seed: 0

model:
  # The repository presets, merged in this order, then `overrides`.
  base: configs/model/_base_.yaml
  preset: configs/model/size50M_graph_simple.yaml
  overrides:
    compile: False
    rep_loss: dreamer
    amp_dtype: bfloat16
    # The actor-side progress objective stays off for the base experiment.
    progress:
      enabled: False
    graph:
      enabled: True
  # Written into the model config from the dataset manifest, never copied:
  # entity_vocab, n_rel, n_abs, n_temp, n_cams, n_max, e_max, centroid bounds.

sequence:
  # Observations before the learning segment used only to rebuild the
  # recurrent state; no loss is taken on them. Windows are contiguous frames
  # of one episode and never cross into another.
  burn_in: 32
  length: 64
  batch_size: 4
  # Learning segments start on real frames; this fraction may start at frame 0.
  start_at_episode_begin_fraction: 0.1

train:
  # Windows are drawn from every training episode (all of them).
  steps: 30000
  log_every: 100
  checkpoint_every: 1000       # latest.pt, for resumption
  snapshot_every: 10000        # step_XXXXXXXX.pt, kept; 0 keeps none

# Fixed windows and episodes from the diagnostic selection, evaluated without
# gradient updates. Those episodes are also trained on: the numbers describe
# fitting and pipeline behaviour, not generalisation, and are logged under
# diagnostic/.
diagnostics:
  every: 1000
  windows: 100
  seed: 12345
  open_loop:
    horizon: 15               # steps of recorded actions through the dynamics alone; step 1 is one-step error
    starts_per_episode: 8
  burn_in_probes: [0, 8, 32]  # steps after the burn-in at which the rebuilt state is compared
  # Written as best_diagnostic.pt beside final.pt: the lowest diagnostic model
  # loss on episodes that were trained on. It is not a better-generalising
  # model, and final.pt remains the default.
  select_checkpoint:
    label: best_diagnostic
    metric: diagnostic/loss/model
    mode: min

# Keys the encoder may read. Anything else in a batch -- rewards, outcomes,
# annotation metadata, future events -- cannot reach it.
observation_keys:
  images: [image_high, image_wrist_right]
  state: state
