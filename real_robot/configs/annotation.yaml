gemini:
  # generate_content | interactions. The model id is part of every cache key.
  backend: generate_content
  model: gemini-2.5-pro
  api_key_env: GEMINI_API_KEY
  temperature: 0.0
  max_output_tokens: 65536
  # default | low | medium | high
  media_resolution: default
  max_retries: 6
  malformed_json_retries: 1
  retry_base_seconds: 5.0
  upload_poll_seconds: 5.0
  # generate_content: count video/text input and check the model limits before generation.
  preflight_tokens: true
  input_token_headroom: 8192
  cache_dir: real_robot/outputs/gemini_cache

videos:
  # Frames per second Gemini is shown; every third recorded frame at 30 Hz.
  fps: 10
  overlay: true
  codec: libx264
  crf: 18
  font_size: 18

annotation:
  # Shorter episodes are skipped.
  min_frames: 30
  # Box keyframes per entity and camera: at most this many recorded frames apart.
  box_every_frames: 15
  # Rounds of targeted repair before an episode is saved as invalid.
  repair_rounds: 2
  # A cut-off answer is asked for again in smaller pieces, at most this deep.
  truncation_splits: 3
