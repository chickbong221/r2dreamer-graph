version: so101-graph-v1

# v_t - v_{t-K} for temporal labels: 10 frames is 0.33 s at 30 Hz.
temporal_window_frames: 10
n_max: 8
e_max: 168
cameras: [top, wrist]

# Entity vocabulary, in id order after padding and the end effector.
entities:
  - {id: ee, key: "<ee>", name: gripper, type: ee,
     description: "the robot's teal two-jaw gripper (one fixed jaw, one moving jaw)",
     reference: "the point midway between the two jaw tips"}
  - {id: banana, key: "actor:banana", name: banana,
     description: "a yellow banana", reference: "the middle of the banana"}
  - {id: pot, key: "actor:pot", name: pot,
     description: "a stainless-steel cooking pot", reference: "the centre of the pot's opening, at rim height"}
  - {id: lid, key: "actor:lid", name: lid,
     description: "the pot's round metal lid with a black handle on top", reference: "the centre of the lid"}
  - {id: red_cube, key: "actor:red_cube", name: red cube,
     description: "a small red cube", reference: "the centre of the cube"}
  - {id: blue_cube, key: "actor:blue_cube", name: blue cube,
     description: "a small blue cube", reference: "the centre of the cube"}
  - {id: cup, key: "actor:cup", name: cup,
     description: "a light-blue translucent plastic mug with a handle", reference: "the centre of the cup's opening, at rim height"}
  - {id: table, key: "actor:table", name: table,
     description: "the black mat and the tabletop under it", reference: "the tabletop directly below the other entity"}

tasks:
  banana_pot_lid:
    dataset_tasks: ["Pick up the banana and place it in the bot, then close the lid"]
    instruction: Pick up the banana and place it in the pot, then put the lid on the pot.
    entities: [ee, banana, pot, lid, table]
    targets: [banana, lid]
    target_rule: >-
      `banana` until the banana rests inside the pot and the gripper has let go of it, and `lid` from then on.
      If the banana leaves the pot again before the lid is on, it is `banana` again until the banana is back
      inside and released.
    facts:
      - pair: [ee, banana]
        relations: [contact, grasp, planar-distance, height-offset, grasp-compatibility, contact-compatibility]
      - pair: [ee, lid]
        relations: [contact, grasp, planar-distance, height-offset, grasp-compatibility, contact-compatibility]
      - pair: [ee, pot]
        relations: [contact, planar-distance, height-offset]
      - pair: [banana, pot]
        relations: [contact, contain, planar-distance, height-offset, contain-compatibility]
      - pair: [lid, pot]
        relations: [contact, support, planar-distance, height-offset, support-compatibility]
      - pair: [banana, lid]
        relations: [contact]
      - pair: [banana, table]
        relations: [support]
      - pair: [lid, table]
        relations: [support]
      - pair: [pot, table]
        relations: [support]

  blue_on_red:
    dataset_tasks: ["Pick blue cube and place on red cube"]
    instruction: Pick up the blue cube and place it on top of the red cube.
    entities: [ee, red_cube, blue_cube, table]
    targets: [blue_cube]
    target_rule: "`blue_cube` on every frame."
    facts:
      - pair: [ee, blue_cube]
        relations: [contact, grasp, planar-distance, height-offset, grasp-compatibility, contact-compatibility]
      - pair: [ee, red_cube]
        relations: [contact, planar-distance, height-offset]
      - pair: [blue_cube, red_cube]
        relations: [contact, support, planar-distance, height-offset, support-compatibility]
      - pair: [blue_cube, table]
        relations: [support]
      - pair: [red_cube, table]
        relations: [support]

  cubes_in_cup:
    dataset_tasks: ["Pick all cubes and place into cup"]
    instruction: Pick up each cube and place it into the cup.
    entities: [ee, red_cube, blue_cube, cup, table]
    targets: [red_cube, blue_cube]
    target_rule: >-
      the cube the robot is reaching for, holding or placing. It switches to the other cube once the first one
      is inside the cup and released; once both are inside, it stays on the last one. A cube that falls out
      of the cup before the task is done becomes the target again.
    facts:
      - pair: [ee, red_cube]
        relations: [contact, grasp, planar-distance, height-offset, grasp-compatibility, contact-compatibility]
      - pair: [ee, blue_cube]
        relations: [contact, grasp, planar-distance, height-offset, grasp-compatibility, contact-compatibility]
      - pair: [ee, cup]
        relations: [contact, planar-distance, height-offset]
      - pair: [red_cube, cup]
        relations: [contact, contain, planar-distance, height-offset, contain-compatibility]
      - pair: [blue_cube, cup]
        relations: [contact, contain, planar-distance, height-offset, contain-compatibility]
      - pair: [red_cube, blue_cube]
        relations: [contact]
      - pair: [red_cube, table]
        relations: [support]
      - pair: [blue_cube, table]
        relations: [support]
      - pair: [cup, table]
        relations: [support]
