defaults:
  - _base_

deter: 4096
hidden: 512
discrete: 32
depth: 32
units: 512
act: 'SiLU'
norm: True

compile: False

graph:
  enabled: True
  n_max: 8
  e_max: 168
  simple_units: 512
  semantic_dim: 512
  decoder_units: 256
  bbox_query_dim: 4

progress:
  enabled: True
  # The launchers state this too. Both say 0.1 on purpose: a preset that
  # disagreed with the command that overrides it is how two arms end up
  # differing by a number nobody chose.
  beta: 0.1
  beta_warmup_start: 200000
  beta_warmup_end: 700000

loss_scales:
  node: 1.0
  nodetgt: 1.0
  relabs: 1.0
  reltemp: 1.0
  graphdyn: 1.0
  graphrep: 0.05
  graphamp: 0.1
  progress_value: 1.0
  progress_model: 1.0
