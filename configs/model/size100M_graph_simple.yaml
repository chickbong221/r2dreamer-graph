defaults:
  - _base_

# Matches the DreamerV3 size100m preset, so this arm and size100M_graph differ
# only in the graph path -- same backbone, same sensors, same representation
# loss.
deter: 6144
hidden: 768
discrete: 48
depth: 48
units: 768
act: 'SiLU'
norm: True

rep_loss: dreamer

# The graph path uses dynamic real-edge batching and is kept eager.
compile: False

# Pooled graph-simple: one global g, no slot table, no UID anywhere in replay
# or the model. Nodes are addressed by the box they currently occupy.
graph_simple: True

graph:
  enabled: True
  state_mode: pooled
  n_max: 8
  e_max: 168
  simple_units: 512
  semantic_dim: 512
  decoder_units: 256
  bbox_query_dim: 4

# Bounded EE->target shaping on its own critic and its own normalisation. The
# reported task return, the reward head and the environment critic are
# untouched.
progress:
  enabled: True
  beta: 0.2
  soft: True

loss_scales:
  # Node reconstruction: entity class and every valid camera's box, averaged
  # per valid node and then per frame. Not comparable with full mode's `node`,
  # which averages appearance, boxes and visibility instead.
  node: 1.0
  nodetgt: 1.0
  relabs: 1.0
  reltemp: 1.0
  graphdyn: 1.0
  graphrep: 0.05
  prior_progress_relabs: 1.0
  progress_value: 1.0
