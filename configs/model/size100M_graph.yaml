defaults:
  - _base_

# Matches the DreamerV3 size100m preset.
deter: 6144
hidden: 768
discrete: 48
depth: 48
units: 768
act: 'SiLU'
norm: True

# Use the stock Dreamer representation loss in both comparison arms.
rep_loss: dreamer

# The graph path uses dynamic real-edge batching and is kept eager.
compile: False

graph:
  enabled: True
