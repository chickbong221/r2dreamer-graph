defaults:
  - _base_

# Direct six-slot dynamics. Identical to size100M_graph except for the graph
# latent: same backbone, same sensors, same representation loss, so the pooled
# and slot arms differ only in what the semantic state is.
deter: 6144
hidden: 768
discrete: 48
depth: 48
units: 768
act: 'SiLU'
norm: True

rep_loss: dreamer
compile: False

# Slot mode is a sub-mode of the relation-only contract: no appearance, no
# boxes, no visibility, no patch coverage.
graph_simple: True

graph:
  enabled: True
  state_mode: slots
  # End effector plus five tracked objects. e_max=64 clears the observed ~35
  # facts with room to spare; graph_fact_drops still has to read zero, because
  # truncation removes spatial relations first.
  n_max: 6
  e_max: 64
  slot_dim: 256
  slot_mixer_layers: 1
  slot_heads: 4

loss_scales:
  # Temporal-change labels are the noisiest fact in the graph, and now they are
  # supervised twice (posterior and prior).
  reltemp: 0.25
