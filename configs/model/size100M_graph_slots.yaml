defaults:
  - _base_

# Direct six-slot dynamics. Identical to size100M_graph except for the graph
# latent: same backbone, same sensors, same representation loss, so the pooled
# and slot arms differ only in what the semantic state is.
deter: 6144
hidden: 768
discrete: 48
depth: 48
units: 768
act: 'SiLU'
norm: True

rep_loss: dreamer
compile: False

# Slot mode is a sub-mode of the relation-only contract: no appearance, no
# boxes, no visibility, no patch coverage.
graph_simple: True

graph:
  enabled: True
  state_mode: slots
  n_max: 8
  e_max: 168
  slot_dim: 256
  slot_mixer_layers: 1
  slot_heads: 4
  slot_births: True

loss_scales:
  nodetgt: 1.0
  relabs: 1.0
  reltemp: 1.0
  slotdyn: 1.0
  slotalive: 1.0
  prior_nodetgt: 1.0
  prior_progress_relabs: 1.0
