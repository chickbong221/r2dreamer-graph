task: maniskill_PickSubtaskTrain-v0
steps: 1e7
env_num: 126
eval_episode_num: 10
action_repeat: 1
train_ratio: 64
time_limit: 100

seed: ${seed}
device: ${device}

progress_mode: ee_target

mshab_task: set_table
mshab_obj: 024_bowl
# Experiment selection. These are unset by default so nothing changes for an
# ordinary run; the A/B configs below set them explicitly.
#
# mshab_objects wins over mshab_obj when non-empty: Experiment A trains on
# five of tidy_house's nine pick targets, balanced to equal plan counts.
mshab_objects: []
# Exact scene names, which is what an experiment can be checked against.
# num_build_configs takes a sorted prefix, so which scene it means moves when
# the build list does.
train_build_config_ids: []
eval_build_config_ids: []
# Ask MS-HAB to spread build configurations evenly across evaluation
# sub-scenes. Required to cover all 63 in one pass; it makes MS-HAB check
# divisibility, so eval_episode_num must be a multiple of the scene count.
eval_even_build_configs: false
eval_panel: ''
eval_seed: 42
eval_lighting:
  enabled: false
  envs_per_condition: 10
  conditions:
    dim: 0.4
    nominal: 1.0
    bright: 2.0

split: train
eval_split: train
eval_num_build_configs: ${env.num_build_configs}
eval_time_limit: 200

eval_render_size: [512, 512]
eval_reconfiguration_frequency: 0
num_build_configs: 10
obs_mode: rgb+segmentation
sim_backend: gpu
control_mode: ''
reward_mode: normalized_dense
# Strict: every MS-HAB subtask implements it, and a silent change here
# would break comparability with the published numbers.
reward_fallback: []
shader_dir: minimal
nonprivileged_obs: false
sim_config: {}
size: [112, 112]
cameras: [fetch_head, fetch_hand]
instruction_table: scenegraph/configs/instructions.npz

encoder:
  mlp_keys: '^(state|instruction)$'
  cnn_keys: '^image_(head|hand)$'
decoder:
  mlp_keys: '^state$'
  cnn_keys: '^image_(head|hand)$'

graph:
  enabled: ${model.graph.enabled}
  mshab_task: ${env.mshab_task}
  entity_vocab: ${model.graph.entity_vocab}
  thresholds_path: ''
  whitelist_dir: ''
  use_target_flag: true
  object_object_spatial: false
  # Independent master switch; Pick experiment profiles enable the fast path.
  disable_object_object_relations: false
  visibility_policy: projected_camera
  n_max: ${model.graph.n_max}
  e_max: ${model.graph.e_max}
  bypass_teemo: false
