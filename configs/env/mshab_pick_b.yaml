# Experiment B -- one object, twenty scenes.
#
# Trains 004_sugar_box in one apartment and evaluates in the first 20, so what
# varies is the room. A clean grasp on purpose: the measurement is scene
# variance, not grasp difficulty.
#
# Twenty rather than all 63 to keep the panel affordable: 20 scene
# environments plus C's 30 lighting environments is 50 in one simulator.
# The selection is a prefix of the sorted build-config names, so the same
# count always names the same scenes and two runs stay comparable -- but it
# is a prefix, not an identity, and which scenes it means would move if the
# installed build list ever changed. The training scene sorts first, so it
# is always inside the prefix; the panel raises at construction if it is not.
#
# Checkpoint selection uses eval/success_once from the configured evaluation
# set below (those 20 scenes); no separate same-scene selector is implemented.
defaults:
  - mshab
  - _self_

mshab_task: tidy_house
mshab_obj: 004_sugar_box
mshab_objects: []
train_build_config_ids:
  - v3_sc0_staging_00.scene_instance.json

# Primary panel: one environment per scene. Lighting rows are added separately.
eval_build_config_ids: []
eval_num_build_configs: 20
eval_episode_num: 20
eval_even_build_configs: true
eval_panel: scenes

# One parallel B+C panel: nominal scenes and 10 matched cases per light setting.
eval_lighting:
  enabled: true

progress_mode: task_schedule

graph:
  disable_object_object_relations: true
