# Experiment B -- one object, five training scenes, forty-two unseen ones.
#
# Trains 004_sugar_box in five arrangements of one apartment and evaluates in
# every arrangement of the other two, so what varies is the room. A clean
# grasp on purpose: the measurement is scene variance, not grasp difficulty.
#
# The scenes are not a count. `scene_manifest` names all forty-seven outright
# and is frozen by scenegraph/tools/freeze_scene_split.py from the installed
# task plans; a name that is not in them raises at construction rather than
# training somewhere else. Training and held-out scenes cannot overlap -- the
# manifest loader refuses that outright, because an unseen-scene score
# measured on a trained scene is not a generalisation number.
#
# 125 training environments, 25 per scene. `train_even_build_configs` is what
# makes that exact rather than approximate: MS-HAB checks divisibility, so 125
# over 5 is 25 each or the run refuses to start.
#
# The evaluation panel is 82 environments in one simulator:
#   42  one episode in each unseen scene            -- scene generalisation
#   10  two episodes in each of the five training scenes -- checkpoint selection
#   30  ten matched cases at 0.4x / 1.0x / 2.0x     -- C, on one fixed scene
# The lighting rows stay on the original single training scene, named in
# eval_lighting.scene. Training in five scenes must not multiply C by five.
#
# Checkpoint selection uses eval_scene/training/success_once -- the ten
# normal-light training-scene cases. Not eval/success_once, which here pools
# the unseen scenes in: selecting on the number the experiment reports would
# choose the checkpoint that got luckiest on the test set.
defaults:
  - mshab
  - _self_

mshab_task: tidy_house
mshab_obj: 004_sugar_box
mshab_objects: []
scene_manifest: configs/scenes/mshab_pick_b.json
# Filled from the manifest before anything is built; named here as empty so
# the two sources can never disagree silently.
train_build_config_ids: []
eval_build_config_ids: []

env_num: 125
train_even_build_configs: true

# Named scenes win over any count, so eval_num_build_configs does not apply.
eval_num_build_configs: 0
eval_episode_num: 52
eval_scene_episodes:
  training: 2
  held_out: 1
# The panel pins every scene itself; an even spread has nothing to arrange,
# and the two halves are deliberately not evenly weighted.
eval_even_build_configs: false
eval_panel: scenes

# One parallel B+C panel: 10 matched cases per light setting, all on the
# original training scene.
eval_lighting:
  enabled: true
  scene: v3_sc0_staging_00.scene_instance.json

progress_mode: task_schedule

graph:
  disable_object_object_relations: true
