defaults:
  - env: mshab
  - model: size100M_graph_simple
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

run_name: ${env.task}-${hydra:runtime.choices.model}
logdir: ${hydra:runtime.cwd}/logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}/${run_name}
seed: 0
# Off. Seeding (set_seed_everywhere, always applied) fixes initialisation and
# sampling; this would additionally fix the *order* of floating-point
# accumulation -- fixed cuBLAS workspace, cuDNN autotuner off, and every op
# required to have a deterministic kernel or PyTorch raises. It costs
# throughput on the fixed-shape pixel convolutions, and the graph path's
# index_add aggregation is exactly the kind of atomics-based op that can be
# refused outright under it.
deterministic_run: False
device: 'cuda:0'

wandb:
  enabled: true
  project: RelRL
  entity: letuanhf-hanoi-university-of-science-and-technology
  # Group is task and model, so the arms of a sweep over anything else land
  # side by side; override `name` to say which arm this one is.
  name: ${run_name}
  group: ${run_name}
  mode: online

hydra:
  run:
    dir: ${logdir}

batch_size: 32
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 9e5
  device: ${device}
  storage_device: cpu

trainer:
  steps: ${env.steps}
  pretrain: 0
  eval_every: 5e4
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  eval_video_log: True
  profile_timing: False
  video_every: 1e6
  video_fps: 15
  params_hist_log: False
  update_log_every: 1500
  action_repeat: ${env.action_repeat}

# One rolling-best checkpoint per run. Off by default, and a run that turns it
# on without naming a metric refuses to start: which evaluation decides the
# best model selects the checkpoint every later number is reported from, so it
# is an experiment decision rather than a default.
checkpoint:
  enabled: false
  start_step: 8e6
  # Required when enabled; MS-HAB A/B launchers set eval/success_once.
  metric: ''
  tiebreak: ''
  mode: max
  path: checkpoint_best.pt

# Optional transfer after successful main training, for either model branch.
# Best eligible main weights, fresh replay/optimizers; no extra checkpoint.
finetune:
  enabled: false
  only: false
  objects: [008_pudding_box]
  steps: 3000000
  eval_episode_num: 10
  initialization: pretrained
  checkpoint_path: ''
