defaults:
  - env: dmc_vision
  - model: size12M
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: 'cuda:0'

wandb:
  enabled: false
  project: RelRL
  entity: letuanhf-hanoi-university-of-science-and-technology
  name: dreamerv3-mshab
  group: na
  mode: online

hydra:
  run:
    dir: ${logdir}

batch_size: 32
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 5e5
  # Where a sampled batch is moved to for the update.
  device: ${device}
  # Where the storage itself lives. LazyTensorStorage allocates the whole
  # max_size as soon as the first batch fixes the shapes, and two 112x112 RGB
  # cameras plus the latent writeback come to roughly 100 KB per transition --
  # about 48 GB at the default max_size, which no single accelerator has spare
  # alongside the model. Host RAM it is; sampling pays one pinned host-to-device
  # copy per batch, which is small next to the update itself.
  storage_device: cpu

trainer:
  steps: ${env.steps}
  pretrain: 0
  eval_every: 1e4
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  video_every: 1e6
  video_fps: 15
  params_hist_log: False
  update_log_every: 5e3
  action_repeat: ${env.action_repeat}
